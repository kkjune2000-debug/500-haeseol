<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing Korean 1 - Appendix and Summary TOC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #555; margin: 0; padding: 20px; }
        .eng { font-family: 'Lato', sans-serif; }
        
        .page-container {
            width: 210mm;
            height: 297mm;
            background: linear-gradient(180deg, #fff 0%, #f1f5f9 100%);
            margin: 0 auto;
            padding: 20mm 18mm 25mm 18mm; 
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .section-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .part-num {
            font-family: 'Lato', sans-serif;
            color: #334155;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1rem;
            display: block;
            margin-bottom: 5px;
        }

        .main-title {
            font-family: 'Lato', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            color: #1e293b;
            line-height: 1.1;
        }

        .sub-title {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #1e293b;
            margin-top: 5px;
        }

        .decorative-line {
            width: 80px;
            height: 6px;
            background: linear-gradient(90deg, #3b82f6, #10b981, #f59e0b, #8b5cf6, #ec4899);
            margin: 20px auto 0;
            border-radius: 3px;
        }

        .content-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
            padding: 0 10mm;
        }

        .list-card {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-left-width: 6px;
            border-radius: 8px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .num-box {
            font-family: 'Lato', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            min-width: 50px;
            text-align: left;
        }

        .text-content { flex-grow: 1; }

        .eng-text {
            font-family: 'Lato', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 2px;
        }

        .kr-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: #64748b;
        }

        /* Unit Colors */
        .unit-1 { border-left-color: #3b82f6; } .unit-1 .num-box { color: #3b82f6; }
        .unit-2 { border-left-color: #10b981; } .unit-2 .num-box { color: #10b981; }
        .unit-3 { border-left-color: #f59e0b; } .unit-3 .num-box { color: #f59e0b; }
        .unit-4 { border-left-color: #8b5cf6; } .unit-4 .num-box { color: #8b5cf6; }
        .unit-5 { border-left-color: #ec4899; } .unit-5 .num-box { color: #ec4899; }

        .page-footer {
            position: absolute;
            bottom: 10mm;
            left: 18mm;
            right: 18mm;
            border-top: 1px solid #e2e8f0;
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
        }

        @media print {
            body { background: none; padding: 0; }
            .page-container { 
                width: 210mm; height: 297mm; margin: 0; 
                padding: 20mm 18mm 25mm 18mm; 
                box-shadow: none; border: none; background: white;
            }
            .list-card { -webkit-print-color-adjust: exact; }
            .unit-1 { border-left-color: #3b82f6 !important; } .unit-1 .num-box { color: #3b82f6 !important; }
            .unit-2 { border-left-color: #10b981 !important; } .unit-2 .num-box { color: #10b981 !important; }
            .unit-3 { border-left-color: #f59e0b !important; } .unit-3 .num-box { color: #f59e0b !important; }
            .unit-4 { border-left-color: #8b5cf6 !important; } .unit-4 .num-box { color: #8b5cf6 !important; }
            .unit-5 { border-left-color: #ec4899 !important; } .unit-5 .num-box { color: #ec4899 !important; }
            .decorative-line { background: linear-gradient(90deg, #3b82f6, #10b981, #f59e0b, #8b5cf6, #ec4899) !important; -webkit-print-color-adjust: exact; }
            .page-footer { border-top: 1px solid #e2e8f0 !important; color: #94a3b8 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="section-header">
            <span class="part-num">Part VII</span>
            <h1 class="main-title">Appendix and Summary</h1>
            <h2 class="sub-title">부록과 총정리</h2>
            <div class="decorative-line"></div>
        </div>

        <div class="content-list">

            <div class="list-card unit-1">
                <div class="num-box">1</div>
                <div class="text-content">
                    <div class="eng-text">Numbers</div>
                    <div class="kr-text">숫자</div>
                </div>
            </div>

            <div class="list-card unit-2">
                <div class="num-box">2</div>
                <div class="text-content">
                    <div class="eng-text">Negation</div>
                    <div class="kr-text">부정법</div>
                </div>
            </div>

            <div class="list-card unit-3">
                <div class="num-box">3</div>
                <div class="text-content">
                    <div class="eng-text">Formal, Informal, Literary Style</div>
                    <div class="kr-text">격식체, 구어체, 문어체</div>
                </div>
            </div>

            <div class="list-card unit-4">
                <div class="num-box">4</div>
                <div class="text-content">
                    <div class="eng-text">Basic Grammar Practice</div>
                    <div class="kr-text">기초문법 연습</div>
                </div>
            </div>

            <div class="list-card unit-5">
                <div class="num-box">5</div>
                <div class="text-content">
                    <div class="eng-text">Basic Grammar Summary</div>
                    <div class="kr-text">기초문법 총정리</div>
                </div>
            </div>

        </div>

        <div class="page-footer">
            <span>116</span>
            <span>Amazing Korean 1</span>
        </div>
    </div>

</body>
</html>
