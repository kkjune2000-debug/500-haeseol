<script>
(function(){
  var fc80 = window.TWORDS;
  const grid = document.getElementById('fc80Grid');
  function fcR(b){if(b.slice(-2)==='하다')return 'H';var s=b.slice(0,-1),c=s.charCodeAt(s.length-1)-0xAC00;if(c<0)return 'C';var j=c%28;return j===0?'V':(j===8?'L':'C');}
  fc80.forEach(function(w, i){
    const n = String(i+1).padStart(2,'0');
    const card = document.createElement('div');
    card.className = 'fc-card';
    card.addEventListener('click', function(){ this.classList.toggle('flipped'); });
    card.innerHTML =
      '<div class="fc-inner">' +
        '<div class="fc-front">' +
          '<span class="fc-num">'+n+'</span>' +
          '<div class="fc-korean">'+w[0]+'</div>' +
          '<div class="fc-english">to '+w[1]+'</div>' +
          '<span class="fc-flip-hint">↻ 클릭</span>' +
        '</div>' +
        '<div class="fc-back">' +
          '<span class="fc-num">'+n+'</span>' +
          '<div class="fc-row-wrap statement">' +
            '<span class="fc-back-label">평서형 · Statement</span>' +
            '<div class="fc-form-row"><span class="fc-form-text">'+w[2]+'</span>' +
            '<button class="fc-tts" onclick="event.stopPropagation();speakKorean(\''+w[2]+'\')">🔊</button></div>' +
          '</div>' +
          '<div class="fc-divider"></div>' +
          '<div class="fc-row-wrap question">' +
            '<span class="fc-back-label">의문형 · Question</span>' +
            '<div class="fc-form-row"><span class="fc-form-text">'+w[3]+'</span>' +
            '<button class="fc-tts" onclick="event.stopPropagation();speakKorean(\''+w[3]+'\')">🔊</button></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });
})();
</script>

.pt-input:focus{outline:none;border-color:#7c97c0;box-shadow:0 0 0 3px rgba(124,151,192,0.12);}
.pt-input.correct{background:#eef7f0;border-color:#cce3d3;color:#4b7358;}
.pt-input.wrong{background:#fbeeee;border-color:#ebcece;color:#9b5757;}
.pt-input.revealed{background:#f5f7fb;border-color:#d6dfec;color:#546a87;font-style:italic;}
@media print{.pt-btns{display:none;}.pt-input{border-color:#cbd5e1;background:#fff !important;color:#334155 !important;}}
/* 쓰기 퀴즈 카드화 (그룹별 4열 — 종합 #pptTable 제외) */
.pt-table:not(#pptTable) thead,.pt-table:not(#pptTable) colgroup{display:none;}
.pt-table:not(#pptTable) tbody{display:flex;flex-direction:column;gap:12px;padding:12px;}
.pt-table:not(#pptTable) tbody tr{display:grid;grid-template-columns:auto 1fr;grid-template-areas:'num base' 'st st' 'qu qu';gap:6px 12px;background:#f8fbff !important;border:1px solid #dbeafe;border-radius:12px;padding:12px 16px;}
.pt-table:not(#pptTable) tbody td{border:none !important;padding:0;background:none !important;text-align:left;vertical-align:top;}
.pt-table:not(#pptTable) td.pt-no{grid-area:num;align-self:center;font-weight:900;color:#3b82f6;font-size:1.05rem;width:auto;}
.pt-table:not(#pptTable) td.pt-base{grid-area:base;align-self:center;text-align:left;width:auto;padding-left:0;}
.pt-table:not(#pptTable) td.pt-base .pt-k{font-size:1.1rem;}
.pt-table:not(#pptTable) td:nth-child(3){grid-area:st;}
.pt-table:not(#pptTable) td:nth-child(4){grid-area:qu;}
.pt-table:not(#pptTable) td:nth-child(3)::before{content:'현재형 평서형 · Present';display:block;font-size:0.72rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;}
.pt-table:not(#pptTable) td:nth-child(4)::before{content:'현재형 의문형 · Present Q';display:block;font-size:0.72rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;}
.pt-table:not(#pptTable) td .pt-input{min-height:46px;font-size:1.05rem;text-align:center;}
.pt-input.correct{animation:wqPop 0.5s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes wqPop{0%{transform:scale(1);}40%{transform:scale(1.04);box-shadow:0 6px 22px rgba(59,130,246,0.40);}100%{transform:scale(1);}}
.wq-badge{position:absolute;top:-10px;right:6px;background:linear-gradient(135deg,#bae6fd,#7dd3fc 60%,#38bdf8);color:#0c4a6e;font-weight:900;font-size:0.78rem;padding:3px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(56,189,248,0.45);z-index:10;pointer-events:none;white-space:nowrap;animation:wqBadge 5s ease forwards;}
.wq-badge small{font-weight:700;font-size:0.7rem;opacity:0.8;margin-left:4px;}
@keyframes wqBadge{0%{transform:translateY(8px) scale(0.7);opacity:0;}8%{transform:translateY(-2px) scale(1.06);opacity:1;}14%{transform:translateY(0) scale(1);opacity:1;}90%{opacity:1;}100%{opacity:0;transform:translateY(-6px);}}
.quiz-box{display:none !important;}
@media(min-width:560px){.pt-table:not(#pptTable) tbody tr{grid-template-columns:auto 1fr 1fr;grid-template-areas:'num base base' 'num st qu';align-items:center;}}
</style>

<style>

</style>
<div class="pt-container">
  <div class="pt-toolbar">
    <div class="pt-score" id="ptScoreBox">✓ 점수 · Score: <span class="pt-correct" id="ptCorrect">0</span> <span class="pt-total">/ 160</span><span class="pt-pct" id="ptPct"></span></div>
    <div class="pt-btns">
      <button class="pt-btn" onclick="ptReset()">🔄 초기화 (Reset)</button>
      <button class="pt-btn grade" onclick="ptGrade()">✅ 점수</button>
      <button class="pt-btn primary" onclick="ptReveal()">💡 정답</button>
    </div>
  </div>
  <table class="pt-table" id="ptTable">
    <colgroup>
      <col style="width:4%">
      <col style="width:22%">
      <col style="width:37%">
      <col style="width:37%">
    </colgroup>

      <tr>
        <th>#</th>
        <th style="text-align:left;padding-left:12px;">기본형 (Base form)</th>
        <th>현재형 평서형 (Present)</th>
        <th>현재형 의문형 (Question)</th>
      </tr>

<script>
(function(){
  var ptWords = window.TWORDS;
  const body = document.getElementById('ptBody');
  let html = '';
  function ptR(b){if(b.slice(-2)==='하다')return 'H';var s=b.slice(0,-1),c=s.charCodeAt(s.length-1)-0xAC00;if(c<0)return 'C';var j=c%28;return j===0?'V':(j===8?'L':'C');}
  var ptList = ptWords;
  ptList.forEach(function(w, i){
    html += '<tr>' +
      '<td class="pt-no">'+(i+1)+'</td>' +
      '<td class="pt-base"><span class="pt-k">'+w[0]+'</span><span class="pt-e">('+w[1]+')</span></td>' +
      '<td><input class="pt-input" type="text" data-ans="'+w[2]+'" oninput="ptCheck(this)" placeholder="..."></td>' +
      '<td><input class="pt-input" type="text" data-ans="'+w[3]+'" oninput="ptCheck(this)" placeholder="..."></td>' +
    '</tr>';
  });
  body.innerHTML = html;
  var ptT=document.querySelector('.pt-total');if(ptT)ptT.textContent='/ '+document.querySelectorAll('#ptTable .pt-input').length;
})();

function ptNormalize(s){ return (s||'').replace(/\s+/g,'').replace(/[?？]/g,''); }
function ptCheck(inp){
  const ans = ptNormalize(inp.dataset.ans);
  const val = ptNormalize(inp.value);
  inp.classList.remove('correct','wrong','revealed');
  if (val.length===0){
    // neutral
  } else if (val === ans) {
    inp.classList.add('correct');
  } else if (!ans.startsWith(val)) {
    inp.classList.add('wrong');
  }
  ptScore();
}
function ptScore(){
  const inputs = document.querySelectorAll('#ptTable .pt-input');
  let c=0;
  inputs.forEach(function(inp){ if(inp.classList.contains('correct')) c++; });
  document.getElementById('ptCorrect').textContent = c;
  document.getElementById('ptPct').textContent = '';
  document.getElementById('ptScoreBox').classList.remove('is-graded');
}
function ptReset(){
  document.querySelectorAll('#ptTable .pt-input').forEach(function(inp){
    inp.value = '';
    inp.classList.remove('correct','wrong','revealed');
  });
  ptScore();
}
function ptReveal(){
  document.querySelectorAll('#ptTable .pt-input').forEach(function(inp){
    inp.value = inp.dataset.ans;
    inp.classList.remove('correct','wrong');
    inp.classList.add('revealed');
  });
  document.getElementById('ptCorrect').textContent = '–';
  document.getElementById('ptPct').textContent = '';
  document.getElementById('ptScoreBox').classList.remove('is-graded');
}
function ptGrade(){
  const inputs = document.querySelectorAll('#ptTable .pt-input');
  let c=0, total=inputs.length;
  inputs.forEach(function(inp){
    inp.classList.remove('correct','wrong','revealed');
    const ans = ptNormalize(inp.dataset.ans);
    const val = ptNormalize(inp.value);
    if (val === ans && val.length>0){ inp.classList.add('correct'); c++; }
    else { inp.classList.add('wrong'); }
  });
  document.getElementById('ptCorrect').textContent = c;
  const pct = total ? Math.round(c*100/total) : 0;
  document.getElementById('ptPct').textContent = '· ' + pct + '%';
  document.getElementById('ptScoreBox').classList.add('is-graded');
  const firstWrong = document.querySelector('#ptTable .pt-input.wrong');
  if (firstWrong) firstWrong.scrollIntoView({behavior:'smooth',block:'center'});
}
</script>

(function(){
  function wqNorm(s){return (s||'').replace(/\s+/g,'').replace(/[?？]/g,'');}
  document.addEventListener('input', function(e){
    var inp=e.target;
    if(!inp || !inp.classList || !inp.classList.contains('pt-input')) return;
    var ans=wqNorm(inp.getAttribute('data-ans')||'');
    var val=wqNorm(inp.value);
    var cell=inp.closest('td') || inp.parentElement;
    if(!cell) return;
    var ex=cell.querySelector('.wq-badge');
    if(val.length && val===ans){
      if(!ex){
        cell.style.position='relative';
        var b=document.createElement('span');
        b.className='wq-badge';
        b.innerHTML='정답! <small>Correct</small>';
        cell.appendChild(b);
        setTimeout(function(){ if(b && b.parentNode) b.parentNode.removeChild(b); },5000);
      }
    } else if(ex){ ex.parentNode.removeChild(ex); }
  }, true);
})();
</script>
